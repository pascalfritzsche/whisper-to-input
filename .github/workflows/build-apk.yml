name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [patch/longer-read-timeout]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-to-input-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Deploy APK to server
        continue-on-error: true
        env:
          APK_DEPLOY_SECRET: ${{ secrets.APK_DEPLOY_SECRET }}
        run: |
          if [ -z "$APK_DEPLOY_SECRET" ]; then
            echo "APK_DEPLOY_SECRET not set - skipping auto-deploy."
            exit 0
          fi
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          curl -sf -X POST \
            "https://morgenschiss.de/api/dictation/apk-upload?versionCode=${VERSION_CODE}&versionName=${VERSION_NAME}" \
            -H "x-apk-deploy-secret: ${APK_DEPLOY_SECRET}" \
            --data-binary @"$APK_PATH"
